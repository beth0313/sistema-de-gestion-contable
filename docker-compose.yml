services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: granizados, POSTGRES_PASSWORD: granizados, POSTGRES_DB: granizados }
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
volumes: { pgdata: {} }
